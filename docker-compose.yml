services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitforce-web
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - bitforce-network

networks:
  bitforce-network:
    driver: bridge
